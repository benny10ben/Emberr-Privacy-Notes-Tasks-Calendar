name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx3g
        -XX:MaxMetaspaceSize=768m
        -Dkotlin.daemon.jvm.options=-Xmx1500m
        -Dfile.encoding=UTF-8

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Run every test on both the desktop and Android targets
        run: ./gradlew :shared:allTests --stacktrace

      - name: Compile the desktop target
        run: ./gradlew :shared:compileKotlinDesktop --stacktrace

      - name: Build the minified release APK to validate the R8 rules
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
